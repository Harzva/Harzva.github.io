<svg xmlns="http://www.w3.org/2000/svg" class="obf-avatar" data-character="tuantuan" data-state="idle" data-motion="off" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="OpenBot companion: tuantuan" style="--obf-phase:0s">
<title>OpenBot companion: tuantuan</title><style>
.obf-avatar{display:block;overflow:visible;isolation:isolate}
.obf-avatar .obf-body{transform-origin:64px 112px;animation:obf-breathe 7s ease-in-out infinite;animation-delay:var(--obf-phase)}
