</g></g></g><path class="obf-spark" d="M110 16L113 10M117 24L123 22" stroke="#FFCB3F" stroke-width="3.5" stroke-linecap="round" fill="none"/><style>/*
 * OpenBot companion night palette
 *
 * The artwork keeps its original light-mode fallbacks in the SVG generators.
 * This layer only supplies semantic paint values when the platform is dark:
 * body, secondary detail, shadow, face fill, face ink and mouth accent.  The
 * wrapper's --ob-accent remains the stored Bot color and is intentionally not
 * reassigned here.
 */
@media (prefers-color-scheme: dark) {
  /* Runtime product mark only. Static files use deep moss green; dark UI keeps moss-lime contrast. */
  .brand .logo {
    --ob-brand-night-fill: #DDF2A5;
    --ob-brand-counter-fill: transparent;
  }

  .brand .logo .ob-brand-mark > path:first-of-type {
    fill: var(--ob-brand-night-fill, #DDF2A5) !important;
  }

  .brand .logo .ob-brand-mark[data-ob-brand-eyes="true"] .ob-brand-eye {
    fill: var(--ob-brand-night-fill, #DDF2A5) !important;
  }

  /* Shared face defaults: warm paper whites and small, readable ink dots. */
  svg.obf-avatar,
  svg.obx-avatar {
    --ob-avatar-body-fill: #e3aa42;
    --ob-avatar-detail-fill: #bc8641;
    --ob-avatar-shadow-fill: #a36d37;
    --ob-avatar-face-fill: #fff7e7;
    --ob-avatar-face-ink: #17181b;
    --ob-avatar-face-line: #17181b;
    --ob-avatar-mouth-accent: #e8796f;
    --ob-avatar-cheek-fill: #e79a87;
    --ob-avatar-spark: #f5bd52;
  }

  svg.obf-avatar .obf-line,
  svg.obx-avatar .obx-line {
    stroke: var(--ob-avatar-face-ink, #17181b) !important;
  }

  svg.obf-avatar[data-character="peek"] .obf-line {
    stroke: var(--ob-avatar-face-line, #fff7e7) !important;
  }

  svg.obf-avatar .obf-gaze > ellipse,
  svg.obx-avatar .obx-pupil > ellipse:first-child {
    fill: var(--ob-avatar-face-ink, #17181b) !important;
  }

  svg.obf-avatar .obf-spark,
  svg.obx-avatar .obx-spark {
    stroke: var(--ob-avatar-spark, #f5bd52) !important;
  }

  /* The first twelve approved geometric companions. */
  svg[data-character="peek"] {
    --ob-avatar-body-fill: #f2b742;
    --ob-avatar-detail-fill: #dc8e31;
    --ob-avatar-shadow-fill: #c9792a;
