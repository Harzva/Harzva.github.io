<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">开源共建社区横版倡议图</title>
  <desc id="desc">邀请热爱开源的开发者、设计师、文档爱好者、测试工程师和产品运营一起参与项目共建。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b40000"/>
      <stop offset="0.42" stop-color="#e31313"/>
      <stop offset="1" stop-color="#ff6b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe884"/>
      <stop offset="1" stop-color="#ffbd2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#fff0df"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7a0000" flood-opacity="0.28"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="3" flood-color="#8b0000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.5" fill="#fff3c5" opacity="0.18"/>
    </pattern>
    <style>
      .font {
        font-family: "Hiragino Sans GB", "STHeiti", "Songti SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .headline {
        font-size: 112px;
        font-weight: 900;
        letter-spacing: 0;
      }
      .subtitle {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .sectionTitle {
        font-size: 34px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 0;
      }
      .cardTitle {
        font-size: 29px;
        font-weight: 900;
        fill: #2b1713;
        letter-spacing: 0;
      }
      .body {
        font-size: 22px;
        font-weight: 600;
        fill: #5d4036;
        letter-spacing: 0;
      }
      .small {
        font-size: 19px;
        font-weight: 600;
        fill: #7a5248;
        letter-spacing: 0;
      }
      .pillText {
        font-size: 24px;
        font-weight: 900;
        fill: #7a1600;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <path d="M-60 720 C210 612 376 845 635 732 C936 600 1120 816 1660 650 L1660 930 L-60 930 Z" fill="#a80000" opacity="0.26"/>
  <path d="M-20 174 C286 70 452 240 766 122 C1032 22 1268 120 1640 8" fill="none" stroke="#ffdf5b" stroke-width="18" opacity="0.25"/>
  <path d="M70 92 L1550 92" stroke="#ffcf55" stroke-width="2" opacity="0.22"/>
  <path d="M72 130 L1250 130" stroke="#ffffff" stroke-width="2" opacity="0.12"/>

  <g transform="translate(82 88)">
    <text class="font headline" x="7" y="107" fill="#650000" opacity="0.36">开源</text>
    <text class="font headline" x="252" y="107" fill="#650000" opacity="0.36">共建</text>
    <text class="font headline" x="517" y="107" fill="#650000" opacity="0.36">社区</text>
    <text class="font headline" x="0" y="98" fill="#ffffff">开源</text>
    <text class="font headline" x="245" y="98" fill="url(#gold)">共建</text>
    <text class="font headline" x="510" y="98" fill="#ffffff">社区</text>
    <g transform="translate(2 138)">
      <rect x="0" y="0" width="660" height="68" rx="20" fill="url(#gold)" filter="url(#softShadow)"/>
      <text class="font subtitle" x="32" y="46" fill="#5a1600">邀请热爱开源的你，一起参与项目共建！</text>
    </g>
    <g transform="translate(0 242)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
      <text class="font small" x="26" y="28" fill="#fff7da">Issue</text>
      <rect x="190" y="0" width="120" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
      <text class="font small" x="225" y="28" fill="#fff7da">PR</text>
      <rect x="330" y="0" width="200" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
      <text class="font small" x="358" y="28" fill="#fff7da">Discussion</text>
      <rect x="550" y="0" width="150" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
      <text class="font small" x="592" y="28" fill="#fff7da">Docs</text>
    </g>
  </g>

  <g transform="translate(1102 74)">
    <rect x="62" y="12" width="330" height="216" rx="34" fill="#fff8e7" opacity="0.94" transform="rotate(5 227 120)" filter="url(#softShadow)"/>
    <rect x="100" y="46" width="252" height="22" rx="11" fill="#ff3f2f" opacity="0.22" transform="rotate(5 226 57)"/>
    <rect x="105" y="90" width="198" height="14" rx="7" fill="#d72c22" opacity="0.18" transform="rotate(5 204 97)"/>
    <rect x="106" y="124" width="232" height="14" rx="7" fill="#d72c22" opacity="0.14" transform="rotate(5 222 131)"/>
    <rect x="106" y="158" width="150" height="14" rx="7" fill="#d72c22" opacity="0.14" transform="rotate(5 181 165)"/>
    <text class="font" x="150" y="171" fill="#d91e18" font-size="70" font-weight="900" transform="rotate(5 166 150)">&lt;/&gt;</text>

    <g transform="translate(0 214)">
      <circle cx="80" cy="160" r="50" fill="#ffcb3c"/>
      <circle cx="230" cy="150" r="58" fill="#ff7a36"/>
      <circle cx="375" cy="160" r="48" fill="#ffdf67"/>
      <rect x="48" y="205" width="64" height="155" rx="32" fill="#ef3b2d"/>
      <rect x="188" y="205" width="84" height="158" rx="42" fill="#f85b35"/>
      <rect x="345" y="205" width="62" height="155" rx="31" fill="#db2520"/>
      <path d="M66 110 C52 82 82 58 106 80 C128 56 160 80 144 112 C132 140 106 154 106 154 C106 154 78 139 66 110 Z" fill="#ffffff"/>
      <path d="M246 86 L310 34 L292 118 Z" fill="#fff1a5" opacity="0.9"/>
      <path d="M372 102 L410 48 L416 116 Z" fill="#fff1a5" opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(76 425)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1448" height="340" rx="42" fill="url(#card)"/>
    <rect x="28" y="28" width="420" height="284" rx="28" fill="#ffffff"/>
    <rect x="492" y="28" width="510" height="284" rx="28" fill="#ffffff"/>
    <rect x="1030" y="28" width="390" height="284" rx="28" fill="#fff8f1"/>

    <g transform="translate(50 54)">
      <path d="M0 0 H288 L250 56 H0 Z" fill="#df1818"/>
      <circle cx="32" cy="28" r="18" fill="#fff3dc"/>
      <path d="M24 25 C18 15 30 7 38 16 C46 7 58 16 52 27 C47 38 38 43 38 43 C38 43 28 38 24 25 Z" fill="#df1818"/>
      <text class="font sectionTitle" x="68" y="40">我们需要</text>
    </g>

    <g transform="translate(60 132)">
      <circle cx="31" cy="31" r="31" fill="#f12424"/>
      <text class="font" x="13" y="42" fill="#ffffff" font-size="34" font-weight="900">&lt;/&gt;</text>
      <text class="font cardTitle" x="88" y="23">贡献代码，完善功能</text>
      <text class="font body" x="88" y="58">让项目更好用，更贴近真实需求</text>
      <line x1="0" y1="90" x2="350" y2="90" stroke="#f0c8c0" stroke-width="2" stroke-dasharray="6 8"/>
    </g>

    <g transform="translate(60 237)">
      <circle cx="31" cy="31" r="31" fill="#f12424"/>
      <path d="M20 42 L42 20 M25 20 H42 V37" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="font cardTitle" x="88" y="23">优化体验，保证稳定</text>
      <text class="font body" x="88" y="58">反馈问题、改进交互、打磨细节</text>
    </g>

    <g transform="translate(514 54)">
      <path d="M0 0 H316 L278 56 H0 Z" fill="#df1818"/>
      <circle cx="32" cy="28" r="18" fill="#fff3dc"/>
      <path d="M22 39 L42 17 M26 17 H42 V33" stroke="#df1818" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="font sectionTitle" x="68" y="40">欢迎这样的你</text>
    </g>

    <g transform="translate(514 126)">
      <rect x="0" y="0" width="86" height="100" rx="18" fill="#fff4ed" stroke="#f7c7bd"/>
      <text class="font" x="24" y="42" fill="#de1b18" font-size="42" font-weight="900">&lt;/&gt;</text>
      <text class="font small" x="22" y="72" fill="#2d1914">开发者</text>

      <rect x="102" y="0" width="86" height="100" rx="18" fill="#fff4ed" stroke="#f7c7bd"/>
      <circle cx="145" cy="35" r="20" fill="#de1b18"/>
      <path d="M132 48 C156 36 166 24 168 10" stroke="#de1b18" stroke-width="7" fill="none" stroke-linecap="round"/>
      <text class="font small" x="126" y="72" fill="#2d1914">设计师</text>

      <rect x="204" y="0" width="86" height="100" rx="18" fill="#fff4ed" stroke="#f7c7bd"/>
      <path d="M230 22 H266 M230 42 H266 M230 62 H252" stroke="#de1b18" stroke-width="8" stroke-linecap="round"/>
      <text class="font" x="214" y="86" fill="#2d1914" font-size="16" font-weight="700">文档爱好者</text>

      <rect x="306" y="0" width="86" height="100" rx="18" fill="#fff4ed" stroke="#f7c7bd"/>
      <circle cx="349" cy="40" r="24" fill="none" stroke="#de1b18" stroke-width="8"/>
      <path d="M328 19 L370 61 M370 19 L328 61" stroke="#de1b18" stroke-width="6"/>
      <text class="font" x="315" y="86" fill="#2d1914" font-size="16" font-weight="700">测试工程师</text>

      <rect x="408" y="0" width="86" height="100" rx="18" fill="#fff4ed" stroke="#f7c7bd"/>
      <path d="M433 34 C426 20 443 10 454 23 C466 10 483 21 476 37 C470 51 454 61 454 61 C454 61 440 52 433 34 Z" fill="#de1b18"/>
      <text class="font" x="423" y="86" fill="#2d1914" font-size="16" font-weight="700">产品运营</text>
    </g>

    <g transform="translate(514 246)">
      <rect x="0" y="0" width="438" height="50" rx="25" fill="#ffe1c1"/>
      <text class="font pillText" x="26" y="34">每一次贡献，都会让项目更好！</text>
    </g>

    <g transform="translate(1052 54)">
      <path d="M0 0 H236 L198 56 H0 Z" fill="#df1818"/>
      <circle cx="32" cy="28" r="18" fill="#fff3dc"/>
      <path d="M20 31 L30 41 L47 18" stroke="#df1818" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="font sectionTitle" x="68" y="40">我们承诺</text>
    </g>

    <g transform="translate(1056 112)">
      <circle cx="22" cy="17" r="10" fill="#df1818"/>
      <text class="font cardTitle" x="54" y="26">认真看每一个回复</text>
      <text class="font" x="54" y="61" fill="#5d4036" font-size="20" font-weight="600">建议、Issue、PR、文档改进都欢迎</text>

      <circle cx="22" cy="86" r="10" fill="#df1818"/>
      <text class="font cardTitle" x="54" y="95">开放友好的协作氛围</text>
      <text class="font body" x="54" y="126">新手友好，导师在线，一起成长</text>

      <circle cx="22" cy="155" r="10" fill="#df1818"/>
      <text class="font cardTitle" x="54" y="164">让好想法真正落地</text>
      <text class="font" x="54" y="195" fill="#5d4036" font-size="20" font-weight="600">从一个想法，到被更多人使用</text>
    </g>
  </g>

  <g transform="translate(96 820)">
    <text class="font" x="0" y="0" fill="#fff8d8" font-size="40" font-weight="900">如果你也想参与共建，现在就来行动吧！</text>
    <text class="font" x="0" y="50" fill="#fff5d3" font-size="24" font-weight="700">提交建议、开 Issue、发 PR，或者来聊聊你的想法都可以。</text>
  </g>
  <g transform="translate(1148 786)">
    <rect x="0" y="0" width="360" height="78" rx="39" fill="#fff2d2" opacity="0.98" filter="url(#softShadow)"/>
    <path d="M38 37 C30 23 48 12 59 25 C72 12 90 24 82 41 C75 56 59 66 59 66 C59 66 46 56 38 37 Z" fill="#d91414"/>
    <text class="font" x="102" y="51" fill="#d91414" font-size="34" font-weight="900">期待你的加入！</text>
  </g>
</svg>
